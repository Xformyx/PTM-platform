# =============================================================================
# PTM Analysis Platform - Docker Compose
# =============================================================================

services:
  # ─── Shared Infrastructure ─────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: ptm-mysql
    platform: linux/amd64
    command: >
      --max-connections=300
      --binlog-expire-logs-seconds=604800
    ports:
      - "3306:3306"
    volumes:
      - ./storage/mysql:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ptm_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptm_platform}
      MYSQL_USER: ${MYSQL_USER:-ptm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ptm_password_change_me}
    networks:
      - ptm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ptm-redis
    ports:
      - "6379:6379"
    volumes:
      - ./storage/redis:/data
    networks:
      - ptm-network
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: ptm-chromadb
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./storage/chromadb:/data
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      ALLOW_RESET: "true"
      IS_PERSISTENT: "TRUE"
    networks:
      - ptm-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ─── Application Services ─────────────────────────────────────────────────

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_API:-001}
    image: ptm-api-server:${VERSION_API:-001}
    container_name: ptm-api-server
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    env_file:
      - .env
    volumes:
      - ./VERSION:/app/VERSION:ro
      - ./GIT_HASH:/app/GIT_HASH:ro
      - ./GIT_DATE:/app/GIT_DATE:ro
      - ./api-server/app:/app/app
      - ./data:/app/data
      - ./storage/reports:/app/storage/reports
      - ./storage/logs:/app/storage/logs
      - ./storage/file_share:/app/storage/file_share
      - ./storage/ptmquant:/app/storage/ptmquant
      # v0.5.3: shared AlphaPeptDeep predicted-library cache.  Every PTMQuant
      # job mounts this into the ptmquant container so AlphaPeptDeep
      # prediction runs at most once per (species, FASTA, PTM set) tuple.
      - ./storage/predicted_lib_cache:/app/storage/predicted_lib_cache
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHROMADB_URL: http://chromadb:8000
      OLLAMA_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://mcp-server:8001
      COSCIENTIST_API_URL: http://ptm-coscientist-api:8080
      CYTOSCAPE_HOST: host.docker.internal
      CYTOSCAPE_PORT: ${CYTOSCAPE_PORT:-1234}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # Reload: noisy in Docker (watchfiles); set false in production .env
      UVICORN_RELOAD: ${UVICORN_RELOAD:-true}
      # Strip ANSI from tools that respect it (cleaner docker logs)
      NO_COLOR: "1"
      INPUT_DIR: /app/data/inputs
      OUTPUT_DIR: /app/data/outputs
      REPORTS_DIR: /app/storage/reports
      REFERENCE_DIR: /app/data/reference
      LOG_DIR: /app/storage/logs
      FILE_SHARE_DIR: /app/storage/file_share
      PTMQUANT_DIR: /app/storage/ptmquant
      PTMQUANT_LIB_CACHE_DIR: ${PTMQUANT_LIB_CACHE_DIR:-/app/storage/predicted_lib_cache}
      HOST_DATA_DIR: ${HOST_DATA_DIR:-}
      # Fallback when job config.yaml has no search_engine (older jobs). New jobs store per-job choice.
      PTMQUANT_DIAQUANT_ENGINE: ${PTMQUANT_DIAQUANT_ENGINE:-alphadia}
      # Keep failed ptmquant worker containers for docker logs / inspect (see .env.example).
      PTMQUANT_KEEP_CONTAINER_ON_FAILURE: "${PTMQUANT_KEEP_CONTAINER_ON_FAILURE:-false}"
      # AlphaDIA worker thread count override (see .env.example for memory-tier guidance).
      # Omit (or set empty) to use the auto-calculated value from max_memory_gb.
      PTMQUANT_ALPHADIA_THREADS: "${PTMQUANT_ALPHADIA_THREADS:-}"
      LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
      # Cloud API keys come from env_file (.env) only — avoids shell env overriding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ptm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_MCP:-001}
    image: ptm-mcp-server:${VERSION_MCP:-001}
    container_name: ptm-mcp-server
    volumes:
      - ./mcp-server/app:/app/app
    environment:
      REDIS_URL: redis://redis:6379/3
      NCBI_EMAIL: ${NCBI_EMAIL:-user@example.com}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_TOOL: ${NCBI_TOOL:-PTM-Platform}
      STRINGDB_API_KEY: ${STRINGDB_API_KEY:-}
    networks:
      - ptm-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-preprocessing:
    build:
      context: ./workers
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_WORKERS:-001}
    image: ptm-workers:${VERSION_WORKERS:-001}
    container_name: ptm-worker-preprocessing
    command: celery -A celery_app worker -Q preprocessing -c ${PREPROCESSING_CONCURRENCY:-2} -n preprocessing@%h -l info
    env_file:
      - .env
    volumes:
      - ./workers:/app
      - ./data:/app/data
      - ./storage/reports:/app/storage/reports
      - ./storage/logs:/app/storage/logs
    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
      MCP_SERVER_URL: http://mcp-server:8001
      OLLAMA_URL: http://host.docker.internal:11434
      CHROMADB_URL: http://chromadb:8000
      INPUT_DIR: /app/data/inputs
      OUTPUT_DIR: /app/data/outputs
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    networks:
      - ptm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-rag:
    build:
      context: ./workers
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_WORKERS:-001}
    image: ptm-workers:${VERSION_WORKERS:-001}
    container_name: ptm-worker-rag
    command: celery -A celery_app worker -Q rag_enrichment -c ${RAG_ENRICHMENT_CONCURRENCY:-3} -n rag@%h -l info
    env_file:
      - .env
    volumes:
      - ./workers:/app
      - ./data:/app/data
      - ./storage/reports:/app/storage/reports
      - ./storage/logs:/app/storage/logs
    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
      MCP_SERVER_URL: http://mcp-server:8001
      CHROMADB_URL: http://chromadb:8000
      OUTPUT_DIR: /app/data/outputs
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      # RAG Enrichment dedicated model (lighter model for speed; falls back to LLM_MODEL if unset)
      RAG_ENRICHMENT_LLM_MODEL: ${RAG_ENRICHMENT_LLM_MODEL:-qwen2.5:14b}
      # RAG Enrichment parallelism (2 PTMs × up to 6 LLM sub-tasks = ~12 max Ollama requests)
      # Increase only if Ollama can handle more simultaneous requests without queue buildup
      RAG_PTM_WORKERS: ${RAG_PTM_WORKERS:-2}
      RAG_MCP_WORKERS: ${RAG_MCP_WORKERS:-6}
      # Max PubMed articles per PTM fed to LLM abstract analysis
      # With batch mode (default): all articles in 1 LLM call → 3 calls/PTM
      # Without batch mode: each article = 1 LLM call → N+2 calls/PTM
      # Reduced to 3 (from 5) to prevent JSON truncation with large Human proteome contexts
      RAG_MAX_ARTICLES: ${RAG_MAX_ARTICLES:-3}
      # Abstract batch mode: analyze all articles in a single LLM call (default: true)
      # Reduces abstract analysis from N LLM calls to 1. Falls back to per-article on failure.
      RAG_ABSTRACT_BATCH_MODE: ${RAG_ABSTRACT_BATCH_MODE:-true}
      # LLM task toggles — set to "false" to disable individual Phase B tasks
      # RAG_ENABLE_LLM=false → skip ALL LLM (abstract + kinase + functional)
      # RAG_ENABLE_KINASE=false / RAG_ENABLE_FUNCTIONAL=false → skip individually
      RAG_ENABLE_LLM: ${RAG_ENABLE_LLM:-true}
      RAG_ENABLE_KINASE: ${RAG_ENABLE_KINASE:-true}
      RAG_ENABLE_FUNCTIONAL: ${RAG_ENABLE_FUNCTIONAL:-true}
      # Note: OLLAMA_NUM_PARALLEL is set on the HOST via:
      #   launchctl setenv OLLAMA_NUM_PARALLEL 6  (macOS)
      # It cannot be set here because Ollama runs on the host, not in Docker.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    networks:
      - ptm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-report:
    build:
      context: ./workers
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_WORKERS:-001}
    image: ptm-workers:${VERSION_WORKERS:-001}
    container_name: ptm-worker-report
    command: celery -A celery_app worker -Q report_generation -c ${REPORT_GENERATION_CONCURRENCY:-2} -n report@%h -l info
    env_file:
      - .env
    volumes:
      - ./workers:/app
      - ./data:/app/data
      - ./storage/reports:/app/storage/reports
      - ./storage/logs:/app/storage/logs
    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
      MCP_SERVER_URL: http://mcp-server:8001
      OLLAMA_URL: http://host.docker.internal:11434
      CHROMADB_URL: http://chromadb:8000
      OUTPUT_DIR: /app/data/outputs
      LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CYTOSCAPE_HOST: host.docker.internal
      CYTOSCAPE_PORT: ${CYTOSCAPE_PORT:-1234}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # v11.9: Recommended 3 for local Ollama (Phase 1 full parallelism); set 2 for cloud APIs with rate limits
      REPORT_LLM_WORKERS: ${REPORT_LLM_WORKERS:-3}
      # v11.9: Cloud API rate limiter (RPM) and max retries for 429/5xx errors
      LLM_CLOUD_RPM: ${LLM_CLOUD_RPM:-100}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-5}
      ENABLE_RQ_REFINEMENT: ${ENABLE_RQ_REFINEMENT:-true}
      ENABLE_REPORT_COPILOT: ${ENABLE_REPORT_COPILOT:-true}
      # v12.1: External Co-Scientist is optional; core reports never depend on it.
      COSCIENTIST_ENABLED: ${COSCIENTIST_ENABLED:-false}
      COSCIENTIST_BASE_URL: ${COSCIENTIST_BASE_URL:-http://ptm-coscientist-api:8080}
      COSCIENTIST_MAX_HYPOTHESES: ${COSCIENTIST_MAX_HYPOTHESES:-2}
      COSCIENTIST_REQUEST_TIMEOUT_SECONDS: ${COSCIENTIST_REQUEST_TIMEOUT_SECONDS:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ptm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ptm-workers:${VERSION_WORKERS:-001}
    container_name: ptm-celery-beat
    command: celery -A celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    volumes:
      - ./workers:/app
    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ptm-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Co-Scientist ─────────────────────────────────────────────────────────

  coscientist-api:
    build:
      context: ../PTM-CoScientist
      dockerfile: Dockerfile
    image: ptm-coscientist-api
    container_name: ptm-coscientist-api
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHROMADB_URL: http://chromadb:8000
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ptm_user}:${MYSQL_PASSWORD:-ptm_password_change_me}@mysql:3306/${MYSQL_DATABASE:-ptm_platform}?charset=utf8mb4
      PTM_ARTIFACTS_DIR: /data/outputs
      COSCIENTIST_OUTPUT_DIR: /data/coscientist/outputs
    volumes:
      - ./data/outputs:/data/outputs:ro
      - ./storage/coscientist:/data/coscientist/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ptm-network
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ─── Gateway & Frontend ────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION_FRONTEND:-001}
    image: ptm-frontend:${VERSION_FRONTEND:-001}
    container_name: ptm-frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ptm-network
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: ptm-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl:/etc/nginx/ssl:ro
    networks:
      - ptm-network
    depends_on:
      api-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Reload nginx when upstream IPs change (e.g. after container restarts)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health || (nginx -s reload && exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  ptm-network:
    driver: bridge
    name: ptm-platform-network
