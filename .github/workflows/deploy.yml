# PTM Platform - Deploy on push to main
# 배포 서버에 SSH 접속 후 deploy.sh 실행
#
# 필수 Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     - 배포 서버 주소 (예: 192.168.1.100 또는 my-server.com)
#   DEPLOY_USER     - SSH 사용자 (예: ubuntu)
#   DEPLOY_PATH     - 서버 내 저장소 경로 (예: /home/ubuntu/ptm-platform)
#   SSH_PRIVATE_KEY - SSH 개인키 전체 내용 (-----BEGIN ... END-----)
#
# 배포 서버 사전 준비:
#   - Docker, Docker Compose 설치
#   - 저장소 clone (git clone ... ptm-platform)
#   - .env 파일 및 기타 설정

name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            ./scripts/deploy.sh
